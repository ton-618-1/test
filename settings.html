<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at center, #102040, #03060d 70%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(rgba(0, 180, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 180, 255, 0.06) 1px, transparent 1px);

            background-size: 40px 40px;
            pointer-events: none;
        }

        .settings {
            position: relative;
            width: 500px;
            padding: 35px;

            background: rgba(5, 15, 30, 0.9);
            border: 1px solid #008cff;
            border-radius: 18px;

            box-shadow: 0 0 35px rgba(0, 170, 255, 0.35);
        }

        h1 {
            text-align: center;
            color: #7eeaff;
            letter-spacing: 5px;

            text-shadow: 0 0 15px #00aaff;

            margin-bottom: 35px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 5px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.15);
        }

        .setting span {
            color: #bcefff;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 180px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .back {
            width: 100%;
            margin-top: 30px;
            padding: 14px;

            background: rgba(0, 140, 220, 0.15);
            color: #bcefff;

            border: 1px solid #008cff;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;

            cursor: pointer;
        }

        .back:hover {
            background: rgba(0, 180, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="settings">

        <h1>⚙ SETTINGS</h1>

        <div class="setting">
            <span>🔊 MUSIC</span>
            <input type="range" min="0" max="100" value="70">
        </div>

        <div class="setting">
            <span>🔉 SOUND EFFECT</span>
            <input type="range" min="0" max="100" value="80">
        </div>

        <div class="setting">
            <span>✨ EFFECTS</span>
            <input type="checkbox" checked>
        </div>

        <div class="setting">
            <span>🎮 FULLSCREEN</span>
            <input type="checkbox">
        </div>

        <button class="back" onclick="backToMenu()">
            ← BACK TO MENU
        </button>

    </div>

    <script>
        function backToMenu() {
            window.location.href = "menu.html";
        }
    </script>

</body>
</html>
